# Production: Elasticsearch for ranking and typo tolerance, kept current from RabbitMQ product events.
spring:
  jpa:
    hibernate:
      # The schema is owned by Flyway; entity/column agreement is verified against H2 by the test suite.
      ddl-auto: none
  flyway:
    # Only the back office migrates the shared database; start it first.
    enabled: ${FLYWAY_ENABLED:false}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/chocomall?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:chocomall}
    password: ${DB_PASSWORD}
  elasticsearch:
    uris: ${ELASTICSEARCH_URIS:http://localhost:9200}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.elasticsearch.ElasticsearchRepositoriesAutoConfiguration

search:
  engine: elasticsearch

chocomall:
  messaging:
    type: rabbit
  seed:
    reference-data: false
