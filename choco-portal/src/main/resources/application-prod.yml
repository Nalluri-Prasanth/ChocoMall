# Production: MySQL, Redis, RabbitMQ and MinIO. Every secret comes from the environment.
spring:
  jpa:
    hibernate:
      # The schema is owned by Flyway; entity/column agreement is verified against H2 by the test suite.
      ddl-auto: none
  flyway:
    # Only the back office migrates the shared database; start it first.
    enabled: ${FLYWAY_ENABLED:false}
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/chocomall?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
    username: ${DB_USERNAME:chocomall}
    password: ${DB_PASSWORD}
  cache:
    type: redis
    redis:
      time-to-live: 5m
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USERNAME:guest}
    password: ${RABBIT_PASSWORD:guest}

secure:
  cors-allowed-origins: ${CORS_ORIGINS:}
  jwt:
    secret: ${JWT_SECRET}

chocomall:
  seed:
    reference-data: false
    demo-shop: false
  store:
    type: redis
  messaging:
    type: rabbit
  storage:
    type: minio
    minio:
      endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
      access-key: ${MINIO_ACCESS_KEY}
      secret-key: ${MINIO_SECRET_KEY}
      bucket: ${MINIO_BUCKET:chocomall}
  sms:
    expose-code: false
